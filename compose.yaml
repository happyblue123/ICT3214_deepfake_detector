name: voicescope-local
services:
  voicescope:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${VOICE_SCOPE_PORT:-8000}:8000"
    environment:
      DETECTOR_PLUGIN: "${DETECTOR_PLUGIN:-}"
      CONTENT_PLUGIN: "${CONTENT_PLUGIN:-}"
      HISTORY_RETENTION_MINUTES: "${HISTORY_RETENTION_MINUTES:-0}"
      MODEL_DIR: /app/models
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ./models:/app/models:ro
      - history:/app/.runtime
    tmpfs:
      - /tmp:mode=1777,size=512m
    read_only: true
    init: true
    restart: "no"
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  history:
